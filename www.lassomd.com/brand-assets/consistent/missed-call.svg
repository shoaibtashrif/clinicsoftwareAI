<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect x="0" y="0" width="1200" height="900" rx="0" fill="#f5f0f7" stroke="none"/><circle cx="1100" cy="100" r="260" fill="#e9dff4"/><rect x="80" y="100" width="1040" height="700" rx="30" fill="white" stroke="none"/><rect x="80" y="100" width="1040" height="80" rx="30" fill="#7958b6" stroke="none"/><text x="120" y="150" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">clinicsoftware.ai</text><text x="120" y="235" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#362650">A missed call can still get a reply</text><text x="120" y="274" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#887796">Illustrative follow-up conversation.</text><rect x="155" y="325" width="630" height="95" rx="20" fill="#f0e9f8" stroke="none"/><text x="185" y="365" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#362650">Sorry we missed your call.</text><text x="185" y="402" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#362650">How can our front desk help?</text><rect x="430" y="455" width="610" height="95" rx="20" fill="#7958b6" stroke="none"/><text x="460" y="511" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="white">I’m checking your opening hours.</text><rect x="155" y="585" width="720" height="105" rx="20" fill="#f0e9f8" stroke="none"/><text x="185" y="627" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#362650">We’re open from 9 AM tomorrow.</text><text x="185" y="665" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#362650">You can also view our hours online.</text></svg>