// Get the iframe elements and loading overlays
var myIframe1 = document.getElementById("my-iframe1");
var myIframe2 = document.getElementById("my-iframe2");
var loadingOverlay1 = document.getElementById("loading-overlay1");
var loadingOverlay2 = document.getElementById("loading-overlay2");

// Get the buttons
var url1Btn = document.getElementById("url1");
var url2Btn = document.getElementById("url2");
var url3Btn = document.getElementById("url3");
var url4Btn = document.getElementById("url4");


function setActiveClass(element, isTextLink) {
  const activeClass = isTextLink ? 'active-text' : 'active-image';
  const otherActiveClass = isTextLink ? 'active-image' : 'active-text';

  const allSiblings = document.querySelectorAll(`.${activeClass}, .${otherActiveClass}`);

  allSiblings.forEach((sibling) => {
    sibling.classList.remove(activeClass);
    sibling.classList.remove(otherActiveClass);
  });

  element.classList.add(activeClass);
}


// Set iframe src to URL1 when page loads
window.onload = function() {
  myIframe1.src = "https://www.markmurphydds.com/";
  myIframe2.src = "https://www.markmurphydds.com/";
}

// Add click event listeners to the buttons
url1Btn.addEventListener("click", function() {
  setActiveClass(url1Btn, true);
  swapUrl(myIframe1, "https://www.markmurphydds.com/", loadingOverlay1);
  swapUrl(myIframe2, "https://www.markmurphydds.com/", loadingOverlay2);
});

url2Btn.addEventListener("click", function() {
  setActiveClass(url2Btn, true);
  swapUrl(myIframe1, "https://www.markmurphydds.com/", loadingOverlay1);
  swapUrl(myIframe2, "https://www.markmurphydds.com/", loadingOverlay2);
});

// Function to swap iframe URL with loading animation
function swapUrl(iframe, url, loadingOverlay) {
  // Show loading overlay only when URL changes
  if (iframe.src != url) {
    loadingOverlay.style.display = "flex";
  }

  // Set iframe src to new URL after a short delay to show loading animation
  setTimeout(function() {
    iframe.src = url;
  }, 500);
}

// Hide loading overlays after iframe content is loaded
myIframe1.addEventListener("load", function() {
  loadingOverlay1.style.display = "none";
});

myIframe2.addEventListener("load", function() {
  loadingOverlay2.style.display = "none";
});






document.addEventListener('DOMContentLoaded', function() {
  var iframe = document.getElementById('my-iframe2');
  iframe.addEventListener('load', function() {
    iframe.contentWindow.addEventListener('wheel', function(event) {
      event.preventDefault();
      iframe.contentWindow.scrollBy(0, event.deltaY);
    });
    iframe.contentWindow.addEventListener('touchmove', function(event) {
      event.preventDefault();
      iframe.contentWindow.scrollTo(0, iframe.contentWindow.pageYOffset - event.touches[0].clientY);
    });
  });
});




$('.device-icon-block').on('click', function() {
  // remove "active" class from all siblings
  $(this).siblings().removeClass('active');
  
  // add "active" class to clicked button
  $(this).addClass('active');
});
